[project]
name = "magnit-mcp"
version = "0.1.0"
description = "Read-only MCP server: проверка продуктовой корзины в Магните по адресу (наличие, цена, итог)"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  # <2 — как в tbank-mcp: в mcp 2.0 нет mcp.server.fastmcp, а server.py импортирует его.
  "mcp>=1.2,<2",
]

[project.scripts]
magnit = "magnit_mcp.cli:main"
magnit-mcp = "magnit_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
